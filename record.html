<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#f9a8c9"/>
<title>小喵饮食管家 - 胆囊炎饮食助手</title>
<meta name="description" content="专为胆囊炎患者设计的饮食管理应用"/>
<link rel="manifest" href="/xiaomiao/manifest.json"/>
<link rel="icon" href="/xiaomiao/icon-192.png"/>
<link rel="apple-touch-icon" href="/xiaomiao/icon-192.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .gradient-bg { background: linear-gradient(180deg, #fff5f7 0%, #fef3f7 40%, #fff 100%); }
  .cute-scroll::-webkit-scrollbar { width: 4px; }
  .cute-scroll::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
  .cute-scroll::-webkit-scrollbar-track { background: transparent; }
  .tab-bar { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-top: 1px solid #fce7f3; }
  .meal-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(236,72,153,0.08); }
  .food-item:active { transform: scale(0.98); }
  .food-item.selected { border-color: #ec4899 !important; background: #fdf2f8 !important; }
  .modal-overlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); }
  .modal-bottom { animation: slideUp 0.25s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .safe-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
  .float-decoration { display: inline-block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .date-chip { white-space: nowrap; }
  .date-chip.active { background: linear-gradient(135deg, #ec4899, #f43f5e); color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body class="h-full overflow-hidden">
<div class="flex flex-col h-full max-w-lg mx-auto relative gradient-bg">
  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto cute-scroll pb-20">
    <div class="min-h-full">
      <!-- Header -->
      <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-pink-100 px-4 pt-[max(0.75rem,env(safe-area-inset-top))] pb-3">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-2xl">📝</span>
          <h1 class="text-lg font-bold text-pink-600">饮食记录</h1>
          <span id="recordStatus" class="ml-auto text-xs text-pink-400">这天还没有记录哦~</span>
        </div>
        <div id="dateBar" class="flex gap-2 overflow-x-auto cute-scroll pb-1" style="scrollbar-width:none"></div>
      </header>

      <!-- Records Area -->
      <div class="px-4 py-3 pb-24">
        <div id="recordsContainer"></div>
        <div id="emptyState" class="text-center py-16">
          <span class="text-5xl mb-4 block float-decoration">🐱</span>
          <p class="text-gray-400 text-sm">这天还没有饮食记录</p>
          <p class="text-gray-300 text-xs mt-1">点击下方「+」按钮添加记录吧~</p>
        </div>
      </div>
    </div>
  </main>

  <!-- FAB -->
  <button id="addBtn" class="fixed bottom-24 right-4 w-14 h-14 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-full shadow-lg flex items-center justify-center text-2xl hover:scale-110 active:scale-95 transition-transform z-30" style="box-shadow:0 4px 20px rgba(236, 72, 153, 0.4)">+</button>

  <!-- Bottom Nav -->
  <nav class="tab-bar fixed bottom-0 left-0 right-0 max-w-lg mx-auto z-50">
    <div class="flex items-center justify-around px-2 pt-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
      <a href="/xiaomiao" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl transition-all duration-200 text-gray-400 hover:text-pink-400">
        <span class="text-xl">🔍</span>
        <span class="text-xs font-medium text-gray-400">搜索</span>
      </a>
      <a href="/xiaomiao/record" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl transition-all duration-200 text-pink-500 scale-105 relative">
        <span class="text-xl">📝</span>
        <span class="text-xs font-medium text-pink-500">记录</span>
        <span class="absolute -bottom-0.5 w-6 h-1 bg-pink-400 rounded-full"></span>
      </a>
      <a href="/xiaomiao/recommend" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl transition-all duration-200 text-gray-400 hover:text-pink-400">
        <span class="text-xl">🍽️</span>
        <span class="text-xs font-medium text-gray-400">推荐</span>
      </a>
      <a href="/xiaomiao/check" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl transition-all duration-200 text-gray-400 hover:text-pink-400">
        <span class="text-xl">🏥</span>
        <span class="text-xs font-medium text-gray-400">自查</span>
      </a>
    </div>
  </nav>
</div>

<!-- Add Record Modal -->
<div id="modal" class="fixed inset-0 z-[60] hidden">
  <div class="modal-overlay absolute inset-0" id="modalOverlay"></div>
  <div class="modal-bottom absolute bottom-0 left-0 right-0 max-w-lg mx-auto bg-white rounded-t-3xl shadow-2xl flex flex-col" style="max-height: 88vh;">
    <!-- Modal Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-pink-100 flex-shrink-0">
      <div class="flex items-center gap-2">
        <span class="text-xl">📝</span>
        <h2 class="text-lg font-bold text-gray-800">添加饮食记录</h2>
      </div>
      <button id="closeModal" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 active:scale-95 transition-transform">✕</button>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 px-5 pt-4 flex-shrink-0">
      <button id="tabLibrary" class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-md">
        🔍 从食物库选择
      </button>
      <button id="tabManual" class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all bg-pink-50 text-pink-500 hover:bg-pink-100">
        ✏️ 手动输入
      </button>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto cute-scroll px-5 py-4">
      <!-- Library Panel -->
      <div id="panelLibrary">
        <div class="relative mb-3">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
          <input id="foodSearch" type="text" placeholder="搜索食物名称..." class="w-full pl-10 pr-4 py-3 rounded-xl bg-pink-50 border border-pink-100 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 focus:border-transparent"/>
        </div>
        <div id="foodList" class="space-y-2"></div>
        <!-- Selected food amount -->
        <div id="selectedFoodInfo" class="hidden mt-4 p-3 rounded-xl bg-pink-50 border border-pink-200">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-medium text-gray-700">已选：<span id="selectedFoodName" class="text-pink-600"></span></span>
            <span id="selectedFoodBadge" class="safe-badge"></span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-500">分量</span>
            <div class="flex items-center gap-2 flex-1">
              <button id="amountMinus" class="w-8 h-8 rounded-full bg-white border border-pink-200 text-pink-500 font-bold active:scale-90 transition-transform">−</button>
              <input id="amountInput" type="number" value="100" min="1" class="flex-1 text-center py-1.5 rounded-lg bg-white border border-pink-200 text-sm focus:outline-none focus:ring-1 focus:ring-pink-300"/>
              <span class="text-xs text-gray-500">g</span>
              <button id="amountPlus" class="w-8 h-8 rounded-full bg-white border border-pink-200 text-pink-500 font-bold active:scale-90 transition-transform">+</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Manual Panel -->
      <div id="panelManual" class="hidden">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-600 mb-2">食物名称</label>
          <input id="manualName" type="text" placeholder="例如：清炒时蔬" class="w-full px-4 py-3 rounded-xl bg-pink-50 border border-pink-100 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 focus:border-transparent"/>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-600 mb-2">分量（克）</label>
          <input id="manualAmount" type="number" value="100" min="1" class="w-full px-4 py-3 rounded-xl bg-pink-50 border border-pink-100 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 focus:border-transparent"/>
        </div>
        <div class="mb-2">
          <label class="block text-sm font-medium text-gray-600 mb-2">安全性（可选）</label>
          <div class="flex gap-2">
            <button class="safety-btn flex-1 py-2 rounded-lg text-xs font-medium bg-green-50 text-green-600 border border-green-200" data-safety="safe">✅ 安全</button>
            <button class="safety-btn flex-1 py-2 rounded-lg text-xs font-medium bg-yellow-50 text-yellow-600 border border-yellow-200" data-safety="moderate">⚠️ 适量</button>
            <button class="safety-btn flex-1 py-2 rounded-lg text-xs font-medium bg-red-50 text-red-600 border border-red-200" data-safety="caution">🚫 谨慎</button>
          </div>
        </div>
      </div>

      <!-- Meal Type (common) -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600 mb-2">选择餐类</label>
        <div class="grid grid-cols-4 gap-2">
          <button class="meal-btn py-2.5 rounded-xl text-sm font-medium bg-pink-50 text-pink-500 border border-pink-100 transition-all" data-meal="breakfast">🌅 早餐</button>
          <button class="meal-btn py-2.5 rounded-xl text-sm font-medium bg-pink-50 text-pink-500 border border-pink-100 transition-all" data-meal="lunch">☀️ 午餐</button>
          <button class="meal-btn py-2.5 rounded-xl text-sm font-medium bg-gradient-to-r from-pink-500 to-rose-500 text-white border border-transparent transition-all" data-meal="dinner">🌙 晚餐</button>
          <button class="meal-btn py-2.5 rounded-xl text-sm font-medium bg-pink-50 text-pink-500 border border-pink-100 transition-all" data-meal="snack">🍪 加餐</button>
        </div>
      </div>

      <!-- Note (common) -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600 mb-2">备注（可选）</label>
        <textarea id="noteInput" rows="2" placeholder="例如：感觉有点油腻..." class="w-full px-4 py-3 rounded-xl bg-pink-50 border border-pink-100 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 focus:border-transparent resize-none"></textarea>
      </div>
    </div>

    <!-- Save Button (fixed at bottom) -->
    <div class="flex-shrink-0 px-5 py-4 border-t border-pink-100 bg-white">
      <button id="saveBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold text-base shadow-lg hover:shadow-xl active:scale-[0.98] transition-all" style="box-shadow:0 4px 16px rgba(236,72,153,0.35)">
        💾 保存记录
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[80] hidden px-6 py-3 rounded-xl bg-gray-800/90 text-white text-sm shadow-xl"></div>

<script>
// ============ Food Library ============
const FOOD_LIBRARY = [
  // 主食
  { name: "白米饭", category: "主食", safety: "safe", safetyText: "安全", calorie: 116 },
  { name: "小米粥", category: "主食", safety: "safe", safetyText: "安全", calorie: 46 },
  { name: "燕麦粥", category: "主食", safety: "safe", safetyText: "安全", calorie: 68 },
  { name: "面条（清汤）", category: "主食", safety: "safe", safetyText: "安全", calorie: 110 },
  { name: "馒头", category: "主食", safety: "safe", safetyText: "安全", calorie: 223 },
  { name: "全麦面包", category: "主食", safety: "safe", safetyText: "安全", calorie: 246 },
  { name: "红薯", category: "主食", safety: "safe", safetyText: "安全", calorie: 86 },
  { name: "玉米", category: "主食", safety: "safe", safetyText: "安全", calorie: 112 },
  // 蔬菜
  { name: "西兰花", category: "蔬菜", safety: "safe", safetyText: "安全", calorie: 34 },
  { name: "胡萝卜", category: "蔬菜", safety: "safe", safetyText: "安全", calorie: 37 },
  { name: "菠菜", category: "蔬菜", safety: "safe", safetyText: "安全", calorie: 24 },
  { name: "白菜", category: "蔬菜", safety: "safe", safetyText: "安全", calorie: 17 },
  { name: "冬瓜", category: "蔬菜", safety: "safe", safetyText: "安全", calorie: 12 },
  { name: "黄瓜", category: "蔬菜", safety: "safe", safetyText: "安全", calorie: 16 },
  { name: "番茄", category: "蔬菜", safety: "safe", safetyText: "安全", calorie: 19 },
  { name: "茄子", category: "蔬菜", safety: "moderate", safetyText: "适量", calorie: 23 },
  { name: "韭菜", category: "蔬菜", safety: "moderate", safetyText: "适量", calorie: 26 },
  { name: "洋葱", category: "蔬菜", safety: "moderate", safetyText: "适量", calorie: 40 },
  { name: "辣椒", category: "蔬菜", safety: "caution", safetyText: "谨慎", calorie: 21 },
  // 蛋白质
  { name: "鸡胸肉", category: "肉蛋", safety: "safe", safetyText: "安全", calorie: 133 },
  { name: "鱼肉（清蒸）", category: "肉蛋", safety: "safe", safetyText: "安全", calorie: 113 },
  { name: "虾仁", category: "肉蛋", safety: "safe", safetyText: "安全", calorie: 87 },
  { name: "鸡蛋清", category: "肉蛋", safety: "safe", safetyText: "安全", calorie: 60 },
  { name: "豆腐", category: "肉蛋", safety: "safe", safetyText: "安全", calorie: 81 },
  { name: "瘦牛肉", category: "肉蛋", safety: "moderate", safetyText: "适量", calorie: 125 },
  { name: "瘦猪肉", category: "肉蛋", safety: "moderate", safetyText: "适量", calorie: 143 },
  { name: "鸡蛋（全蛋）", category: "肉蛋", safety: "moderate", safetyText: "适量", calorie: 144 },
  { name: "鸭肉", category: "肉蛋", safety: "moderate", safetyText: "适量", calorie: 240 },
  { name: "肥肉", category: "肉蛋", safety: "caution", safetyText: "谨慎", calorie: 807 },
  { name: "炸鸡", category: "肉蛋", safety: "caution", safetyText: "谨慎", calorie: 279 },
  { name: "香肠", category: "肉蛋", safety: "caution", safetyText: "谨慎", calorie: 508 },
  // 水果
  { name: "苹果", category: "水果", safety: "safe", safetyText: "安全", calorie: 53 },
  { name: "香蕉", category: "水果", safety: "safe", safetyText: "安全", calorie: 91 },
  { name: "橙子", category: "水果", safety: "safe", safetyText: "安全", calorie: 48 },
  { name: "梨", category: "水果", safety: "safe", safetyText: "安全", calorie: 51 },
  { name: "西瓜", category: "水果", safety: "safe", safetyText: "安全", calorie: 25 },
  { name: "葡萄", category: "水果", safety: "moderate", safetyText: "适量", calorie: 44 },
  { name: "荔枝", category: "水果", safety: "moderate", safetyText: "适量", calorie: 70 },
  // 奶制品
  { name: "脱脂牛奶", category: "奶豆", safety: "safe", safetyText: "安全", calorie: 34 },
  { name: "低脂牛奶", category: "奶豆", safety: "safe", safetyText: "安全", calorie: 47 },
  { name: "酸奶（低脂）", category: "奶豆", safety: "safe", safetyText: "安全", calorie: 72 },
  { name: "全脂牛奶", category: "奶豆", safety: "moderate", safetyText: "适量", calorie: 65 },
  // 油脂/其他
  { name: "橄榄油", category: "调料", safety: "moderate", safetyText: "适量", calorie: 899 },
  { name: "花生油", category: "调料", safety: "moderate", safetyText: "适量", calorie: 899 },
  { name: "黄油", category: "调料", safety: "caution", safetyText: "谨慎", calorie: 888 },
  { name: "奶油", category: "调料", safety: "caution", safetyText: "谨慎", calorie: 879 },
];

const SAFETY_STYLES = {
  safe: { bg: "bg-green-50", text: "text-green-600", border: "border-green-200", label: "✅ 安全" },
  moderate: { bg: "bg-yellow-50", text: "text-yellow-600", border: "border-yellow-200", label: "⚠️ 适量" },
  caution: { bg: "bg-red-50", text: "text-red-600", border: "border-red-200", label: "🚫 谨慎" },
};

const MEAL_INFO = {
  breakfast: { label: "早餐", icon: "🌅", color: "from-orange-400 to-amber-400" },
  lunch: { label: "午餐", icon: "☀️", color: "from-yellow-400 to-orange-400" },
  dinner: { label: "晚餐", icon: "🌙", color: "from-indigo-400 to-purple-400" },
  snack: { label: "加餐", icon: "🍪", color: "from-pink-400 to-rose-400" },
};

// ============ State ============
let currentDate = formatDate(new Date());
let selectedMeal = "dinner";
let selectedFood = null;
let manualSafety = null;
let activeTab = "library";

// ============ Utils ============
function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function formatDateShort(dateStr) {
  const [y, m, d] = dateStr.split("-");
  return `${parseInt(m)}/${parseInt(d)}`;
}

function getDayLabel(dateStr) {
  const today = formatDate(new Date());
  const yesterday = formatDate(new Date(Date.now() - 86400000));
  if (dateStr === today) return "今天";
  if (dateStr === yesterday) return "昨天";
  return formatDateShort(dateStr);
}

function getRecords(dateStr) {
  try {
    const all = JSON.parse(localStorage.getItem("xiaomiao_records") || "{}");
    return all[dateStr] || [];
  } catch { return []; }
}

function saveRecords(dateStr, records) {
  const all = JSON.parse(localStorage.getItem("xiaomiao_records") || "{}");
  all[dateStr] = records;
  localStorage.setItem("xiaomiao_records", JSON.stringify(all));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 1800);
}

// ============ Date Bar ============
function renderDateBar() {
  const bar = document.getElementById("dateBar");
  const dates = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(Date.now() - i * 86400000);
    dates.push(formatDate(d));
  }
  bar.innerHTML = dates.map(d => {
    const active = d === currentDate ? "active" : "bg-white text-gray-500 border border-pink-100";
    return `<button class="date-chip px-4 py-1.5 rounded-full text-sm font-medium transition-all ${active}" data-date="${d}">${getDayLabel(d)}</button>`;
  }).join("");
  bar.querySelectorAll(".date-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      currentDate = btn.dataset.date;
      renderDateBar();
      renderRecords();
    });
  });
}

// ============ Records Rendering ============
function renderRecords() {
  const records = getRecords(currentDate);
  const container = document.getElementById("recordsContainer");
  const empty = document.getElementById("emptyState");
  const status = document.getElementById("recordStatus");

  if (records.length === 0) {
    container.innerHTML = "";
    empty.classList.remove("hidden");
    status.textContent = "这天还没有记录哦~";
    return;
  }
  empty.classList.add("hidden");
  status.textContent = `共 ${records.length} 条记录`;

  // Group by meal
  const groups = { breakfast: [], lunch: [], dinner: [], snack: [] };
  records.forEach(r => groups[r.meal]?.push(r));

  let html = "";
  let totalCal = 0;
  for (const meal of ["breakfast", "lunch", "dinner", "snack"]) {
    if (groups[meal].length === 0) continue;
    const info = MEAL_INFO[meal];
    html += `<div class="mb-4">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-lg">${info.icon}</span>
        <span class="text-sm font-bold text-gray-700">${info.label}</span>
        <span class="text-xs text-gray-400">${groups[meal].length} 项</span>
      </div>
      <div class="space-y-2">`;
    groups[meal].forEach(r => {
      const s = SAFETY_STYLES[r.safety] || SAFETY_STYLES.safe;
      const cal = r.calorie ? Math.round(r.calorie * (r.amount / 100)) : null;
      if (cal) totalCal += cal;
      html += `<div class="meal-card p-3 flex items-center gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-sm font-medium text-gray-800 truncate">${escapeHtml(r.name)}</span>
            <span class="safe-badge ${s.bg} ${s.text}">${s.label}</span>
          </div>
          <div class="flex items-center gap-3 mt-1 text-xs text-gray-400">
            <span>⚖️ ${r.amount}g</span>
            ${cal ? `<span>🔥 ${cal} 千卡</span>` : ""}
            ${r.note ? `<span class="truncate">📝 ${escapeHtml(r.note)}</span>` : ""}
          </div>
        </div>
        <button class="del-btn w-8 h-8 rounded-full bg-red-50 text-red-400 flex items-center justify-center text-sm hover:bg-red-100 active:scale-90 transition-transform flex-shrink-0" data-id="${r.id}">🗑</button>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Summary
  html = `<div class="mb-4 p-3 rounded-xl bg-gradient-to-r from-pink-50 to-rose-50 border border-pink-100 flex items-center justify-between">
    <span class="text-sm text-gray-600">📊 今日合计</span>
    <span class="text-sm font-bold text-pink-600">约 ${totalCal} 千卡 · ${records.length} 项</span>
  </div>` + html;

  container.innerHTML = html;

  // Delete handlers
  container.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const recs = getRecords(currentDate).filter(r => r.id !== id);
      saveRecords(currentDate, recs);
      renderRecords();
      showToast("已删除");
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ============ Food List ============
function renderFoodList(filter = "") {
  const list = document.getElementById("foodList");
  const filtered = FOOD_LIBRARY.filter(f => f.name.includes(filter) || f.category.includes(filter));
  if (filtered.length === 0) {
    list.innerHTML = `<p class="text-center text-gray-400 text-sm py-8">没有找到相关食物</p>`;
    return;
  }
  // Group by category
  const cats = {};
  filtered.forEach(f => {
    if (!cats[f.category]) cats[f.category] = [];
    cats[f.category].push(f);
  });
  let html = "";
  for (const [cat, foods] of Object.entries(cats)) {
    html += `<div class="mb-3"><p class="text-xs font-medium text-gray-400 mb-1.5 px-1">${cat}</p><div class="space-y-1.5">`;
    foods.forEach(f => {
      const s = SAFETY_STYLES[f.safety];
      const isSelected = selectedFood && selectedFood.name === f.name;
      html += `<button class="food-item w-full text-left p-2.5 rounded-xl border border-pink-100 bg-white flex items-center justify-between transition-all ${isSelected ? "selected" : ""}" data-name="${f.name}">
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-700">${f.name}</span>
          <span class="safe-badge ${s.bg} ${s.text}">${s.label}</span>
        </div>
        <span class="text-xs text-gray-400">${f.calorie}千卡/100g</span>
      </button>`;
    });
    html += `</div></div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll(".food-item").forEach(item => {
    item.addEventListener("click", () => {
      const food = FOOD_LIBRARY.find(f => f.name === item.dataset.name);
      selectedFood = food;
      renderFoodList(document.getElementById("foodSearch").value);
      const info = document.getElementById("selectedFoodInfo");
      const badge = document.getElementById("selectedFoodBadge");
      const s = SAFETY_STYLES[food.safety];
      info.classList.remove("hidden");
      document.getElementById("selectedFoodName").textContent = food.name;
      badge.className = `safe-badge ${s.bg} ${s.text}`;
      badge.textContent = s.label;
    });
  });
}

// ============ Modal ============
function openModal() {
  document.getElementById("modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  resetModal();
}

function closeModal() {
  document.getElementById("modal").classList.add("hidden");
  document.body.style.overflow = "";
}

function resetModal() {
  selectedFood = null;
  manualSafety = null;
  activeTab = "library";
  selectedMeal = "dinner";
  document.getElementById("foodSearch").value = "";
  document.getElementById("selectedFoodInfo").classList.add("hidden");
  document.getElementById("manualName").value = "";
  document.getElementById("manualAmount").value = "100";
  document.getElementById("amountInput").value = "100";
  document.getElementById("noteInput").value = "";
  switchTab("library");
  updateMealButtons();
  updateSafetyButtons();
  renderFoodList("");
}

function switchTab(tab) {
  activeTab = tab;
  const lib = document.getElementById("tabLibrary");
  const man = document.getElementById("tabManual");
  const panelLib = document.getElementById("panelLibrary");
  const panelMan = document.getElementById("panelManual");
  if (tab === "library") {
    lib.className = "flex-1 py-2.5 rounded-xl text-sm font-medium transition-all bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-md";
    man.className = "flex-1 py-2.5 rounded-xl text-sm font-medium transition-all bg-pink-50 text-pink-500 hover:bg-pink-100";
    panelLib.classList.remove("hidden");
    panelMan.classList.add("hidden");
  } else {
    man.className = "flex-1 py-2.5 rounded-xl text-sm font-medium transition-all bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-md";
    lib.className = "flex-1 py-2.5 rounded-xl text-sm font-medium transition-all bg-pink-50 text-pink-500 hover:bg-pink-100";
    panelMan.classList.remove("hidden");
    panelLib.classList.add("hidden");
  }
}

function updateMealButtons() {
  document.querySelectorAll(".meal-btn").forEach(btn => {
    if (btn.dataset.meal === selectedMeal) {
      btn.className = "meal-btn py-2.5 rounded-xl text-sm font-medium bg-gradient-to-r from-pink-500 to-rose-500 text-white border border-transparent transition-all";
    } else {
      btn.className = "meal-btn py-2.5 rounded-xl text-sm font-medium bg-pink-50 text-pink-500 border border-pink-100 transition-all";
    }
  });
}

function updateSafetyButtons() {
  document.querySelectorAll(".safety-btn").forEach(btn => {
    if (btn.dataset.safety === manualSafety) {
      btn.classList.add("ring-2", "ring-offset-1", "ring-pink-300");
    } else {
      btn.classList.remove("ring-2", "ring-offset-1", "ring-pink-300");
    }
  });
}

// ============ Save ============
function saveRecord() {
  let name, amount, safety, calorie;
  if (activeTab === "library") {
    if (!selectedFood) {
      showToast("请先从食物库选择一个食物");
      return;
    }
    name = selectedFood.name;
    amount = parseInt(document.getElementById("amountInput").value) || 100;
    safety = selectedFood.safety;
    calorie = selectedFood.calorie;
  } else {
    name = document.getElementById("manualName").value.trim();
    if (!name) {
      showToast("请输入食物名称");
      return;
    }
    amount = parseInt(document.getElementById("manualAmount").value) || 100;
    safety = manualSafety || "moderate";
    calorie = null;
  }
  const note = document.getElementById("noteInput").value.trim();
  const record = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name, amount, safety, calorie, meal: selectedMeal, note,
    createdAt: new Date().toISOString(),
  };
  const records = getRecords(currentDate);
  records.push(record);
  saveRecords(currentDate, records);
  closeModal();
  renderRecords();
  showToast("✅ 保存成功！");
}

// ============ Event Bindings ============
document.getElementById("addBtn").addEventListener("click", openModal);
document.getElementById("closeModal").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", closeModal);
document.getElementById("saveBtn").addEventListener("click", saveRecord);
document.getElementById("tabLibrary").addEventListener("click", () => switchTab("library"));
document.getElementById("tabManual").addEventListener("click", () => switchTab("manual"));
document.getElementById("foodSearch").addEventListener("input", e => renderFoodList(e.target.value));

document.getElementById("amountMinus").addEventListener("click", () => {
  const input = document.getElementById("amountInput");
  input.value = Math.max(1, (parseInt(input.value) || 100) - 10);
});
document.getElementById("amountPlus").addEventListener("click", () => {
  const input = document.getElementById("amountInput");
  input.value = (parseInt(input.value) || 100) + 10;
});

document.querySelectorAll(".meal-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedMeal = btn.dataset.meal;
    updateMealButtons();
  });
});

document.querySelectorAll(".safety-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    manualSafety = manualSafety === btn.dataset.safety ? null : btn.dataset.safety;
    updateSafetyButtons();
  });
});

// ============ Init ============
renderDateBar();
renderRecords();
</script>
</body>
</html>
